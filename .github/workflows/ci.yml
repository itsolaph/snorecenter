name: SnoreCenter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate overnight WAV samples
        run: npm run generate-samples
      - name: Run DSP, Connector, and HTTP API tests
        run: npm test
